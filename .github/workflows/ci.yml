name: CI

on:
  push:
    branches: [main, data-dev]
  pull_request:
    branches: [main, data-dev]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: python -m ruff check src/ tests/

      - name: Format check (black)
        run: python -m black --check src/ tests/

      - name: Run tests with coverage
        run: python -m pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=70

      - name: Integration smoke-test (synthetic fixtures)
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from src.utils.io import load_csv
          from src.utils.validate import validate_schema
          from src.utils.clean import parse_skill_list, standardise_columns
          from src.utils.stats import detect_outliers_iqr, wilson_confidence_interval
          import pandas as pd
          import numpy as np
          df = load_csv('tests/fixtures/sample_job_postings.csv', parse_dates=['date_posted'])
          assert not df.empty
          lo, hi = wilson_confidence_interval(10, 100)
          assert 0 <= lo <= 0.10 <= hi <= 1
          print('Smoke test passed.')
          "
